<div class="div-geral">
  <div class="form-account">
    <img src="imgs/glitch_dark.png" class="img-logo" />
    <h4>Preencha o formulário para criar uma conta:</h4>
    <a class="link_voltar" routerLink="/login"
      >Entrar <mat-icon>chevron_right</mat-icon></a
    >

    <div class="avatar-upload-box">
      <div class="avatar-preview-wrapper">
        <img
          [src]="avatarPreviewUrl"
          alt="Foto de perfil"
          class="avatar-preview"
        />
        <button
          type="button"
          class="avatar-edit-btn"
          (click)="abrirSeletorAvatar()"
          title="Alterar foto"
          aria-label="Alterar foto"
        >
          <mat-icon>edit</mat-icon>
        </button>
      </div>
      <input
        #avatarInput
        type="file"
        accept="image/jpeg,image/png,image/webp"
        (change)="onAvatarSelecionado($event)"
        hidden
      />
      <p class="avatar-upload-hint">JPG, PNG ou WEBP (máx. 2MB)</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-row">
        <app-input
          icon="person"
          label="Nome"
          placeholder="Digite seu primeiro nome"
          type="text"
          [control]="firstNameControl"
        >
        </app-input>

        <app-input
          icon="person"
          label="Sobrenome"
          placeholder="Digite seu último sobrenome"
          type="text"
          [control]="lastNameControl"
        >
        </app-input>
      </div>
      <div class="form-row">
        <app-input
          icon="person"
          label="Nickname"
          placeholder="Digite seu nickname"
          type="text"
          [control]="nicknameControl"
        >
        </app-input>
      </div>
      <hr class="separator" />

      <div class="form-row">
        <app-input
          icon="mail"
          label="Email"
          placeholder="Digite seu email"
          type="email"
          [control]="emailControl"
        >
        </app-input>

        <app-input
          icon="phone"
          label="Celular"
          placeholder="Digite seu celular"
          type="text"
          [control]="phoneControl"
          mask="(00) 00000-0000"
        >
        </app-input>
      </div>

      <div class="form-row">
        <app-input
          icon="key"
          label="Senha"
          placeholder="Digite sua senha"
          type="password"
          [control]="passwordControl"
        >
        </app-input>
        <app-input
          icon="key"
          label="Confirme a senha"
          placeholder="Confirme sua senha"
          type="password"
          [control]="confirmPasswordControl"
        >
        </app-input>
      </div>

      <hr class="separator" />

      <div class="form-row">
        <app-input
          icon="person"
          label="CPF"
          placeholder="Digite seu CPF"
          type="text"
          [control]="cpfControl"
          mask="000.000.000-00"
        >
        </app-input>

        <app-input
          icon="Cake"
          label="Data de nascimento"
          placeholder="00/00/00"
          type="date"
          [control]="birthdayControl"
        >
        </app-input>
      </div>

      <div class="form-row">
        <app-input
          icon="MapPinHouse"
          label="Nacionalidade"
          placeholder="Selecione a nacionalidade"
          type="select"
          [options]="countries"
          [control]="nationalityControl"
        >
        </app-input>
      </div>

      <hr class="separator" />

      <div>
        <app-input
          type="textarea"
          label="Sobre mim:"
          [control]="aboutMeControl"
          [maxlength]="500"
          placeholder="Escreva sobre você (essas informações aparecerão no seu perfil)"
        ></app-input>
      </div>
      <div style="display: flex; justify-content: center">
        <app-button
          size="big"
          style="margin: 4%"
          (click)="submit()"
          label="Criar"
          icon="add_circle"
          iconPosition="left"
        >
        </app-button>
      </div>
    </form>
  </div>
</div>
