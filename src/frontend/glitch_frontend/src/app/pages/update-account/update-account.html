<div class="div-geral">
  <div class="form-account">
    <img src="imgs/glitch_dark.png"  class="img-logo" />
    <h4>Edite suas informações e pressione o botão de salvar.</h4>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-row">
        <app-input
        
          icon="person"
          label="Nickname"
          placeholder="Digite seu nickname"
          type="text"
          [control]="nicknameControl"
        >
        </app-input>
      </div>

      <div class="form-row">
        <app-input
          icon="phone"
          label="Celular"
          placeholder="Digite seu celular"
          type="tel"
          prefix=""
          mask="(00) 00000-0000"
          [control]="phoneControl"
        >
        </app-input>
        <app-input
          icon="mail"
          label="E-mail"
          placeholder="Digite seu e-mail"
          type="mail"
          (input)="normalizeEmail($event)"
          [control]="emailControl"
        >
        </app-input>
      </div>

      <hr class="separator" />

      <div class="form-row">
        <app-input
          type="textarea"
          label="Sobre mim:"
          [control]="aboutMeControl"
          [maxlength]="500"
          placeholder="Escreva sobre você (essas informações aparecerão no seu perfil)"
        ></app-input>
      </div>

      <div class="buttons-row">
        <app-button
          (click)="submit()"
          label="Salvar"
          icon="add_circle"
          iconPosition="left"
        >
        </app-button>

        <app-button
          type="button"
          color="primary"
          label="Cancelar"
          icon="cancel"
          iconPosition="left"
          (click)="cancel()"
        ></app-button>
      </div>
    </form>
  </div>
</div>
